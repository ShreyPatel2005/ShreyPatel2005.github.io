[build]
  publish = "."

# Permanent 301 redirect all Netlify traffic to shreyhpatel.me
[[redirects]]
  from = "https://shreyhpatel.netlify.app/*"
  to = "https://shreyhpatel.me/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://shreyhpatel.netlify.app/*"
  to = "https://shreyhpatel.me/:splat"
  status = 301
  force = true

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# /resume -> PDF
[[redirects]]
  from = "/resume"
  to = "/ShreyhPatel_Resume.pdf"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
